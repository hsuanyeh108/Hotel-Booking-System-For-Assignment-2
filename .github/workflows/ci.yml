
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Test
        run: python -m pytest -v

  deploy:
    name: Deploy to EC2
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python3 -m venv venv
          venv/bin/pip install -r requirements.txt

      - name: Write .env from secret
        env:
          PROD_ENV: ${{ secrets.PROD }}
        run: printf '%s\n' "$PROD_ENV" > .env

      - name: Restart app with pm2
        run: |
          pm2 delete hotel || true
          pm2 start "venv/bin/gunicorn -w 2 -b 127.0.0.1:3000 app:app" --name hotel
          pm2 save